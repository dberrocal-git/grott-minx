name: CI

# No scheduled runs: lint tools are pinned in uv.lock, so Dependabot bumps
# (and their PR checks) are the drift detector. CodeQL keeps its own schedule.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync environment (installs Python 3.14t + deps from uv.lock)
        run: uv sync

      - name: ruff
        run: uv run ruff check grott.py grottproxy.py grottdata.py tests/test_smoke.py

      - name: pylint
        run: uv run pylint grott.py grottproxy.py grottdata.py

      - name: smoke test
        run: uv run python tests/test_smoke.py
